<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>MyKids School Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #002663; --red: #e11d48; --gold: #d4af37; --blue: #1e40af; }
        body { font-family: 'Battambang', cursive; background: #f1f5f9; margin: 0; padding: 20px; }
        
        .no-print-area { max-width: 1000px; margin: 0 auto 30px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-main { background: var(--blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: 'Moul'; margin: 5px; }
        .btn-download { background: #15803d; display: none; margin: 20px auto; width: 100%; font-size: 14pt; }

        /* PDF Container - A4 Standard */
        .pdf-container { 
            width: 210mm; min-height: 297mm; background: white; 
            margin: 0 auto; padding: 15mm 15mm 25mm 15mm; 
            box-sizing: border-box; display: none; 
            flex-direction: column; justify-content: space-between;
        }

        /* Header Style */
        .header-section { display: flex; justify-content: space-between; font-family: 'Moul'; font-size: 10pt; line-height: 1.6; }
        .school-info { text-align: center; color: var(--navy); }
        .nation-info { text-align: center; }

        /* Table Style */
        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; border: 1.5px solid black; }
        .report-table th, .report-table td { border: 1px solid black; padding: 8px; text-align: center; }
        .report-table th { background: #f2f2f2; font-family: 'Moul'; font-size: 9pt; }

        /* Honor Board Layout - FIXED */
        .honor-frame { border: 12px double var(--blue); padding: 15px; height: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        .star-container { display: flex; flex-direction: column; align-items: center; gap: 30px; margin: 40px 0; flex-grow: 1; }
        .student-row { display: flex; justify-content: space-around; width: 100%; }
        
        .student-card { text-align: center; width: 160px; position: relative; }
        .rank-number { font-family: 'Moul'; color: var(--red); font-size: 24pt; margin-bottom: 5px; }
        .photo-frame { width: 120px; height: 150px; border: 4px solid var(--gold); margin: 0 auto; background: #eee; overflow: hidden; }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
        .name-label { background: var(--navy); color: white; padding: 5px; border-radius: 20px; font-family: 'Moul'; font-size: 9pt; margin-top: 8px; display: block; }

        /* Footer Signature - FIXED AT BOTTOM */
        .signature-section { display: flex; justify-content: space-between; text-align: center; padding: 0 20px; margin-top: auto; }
        .signature-box { width: 200px; font-family: 'Moul'; font-size: 11pt; }
    </style>
</head>

            { id: '00', name: 'ជាឡិច កូលីន', sex: 'M' }, { id: '00', name: 'ណារ៉ា ហេងលី', sex: 'M' },
            { id: '00', name: 'ឆន វិរៈសិទ្ធ', sex: 'M' }, { id: '00', name: 'សុខ សម្បត្តិ', sex: 'M' },
            { id: '00', name: 'សុខ ដាលីស', sex: 'F' }, { id: '00', name: 'លី ឆាយឈ័នប', sex: 'M' }
        ],
        'Level1': [
            { id: '00', name: 'អោក ឧត្តម', sex: 'M' }, { id: '00', name: 'ណារ៉ា ហេងឡាយ', sex: 'M' },
            { id: '62', name: 'ឈូក ឈិនឡុង', sex: 'M' }, { id: '00', name: 'ពៅ សុនីតា', sex: 'F' },
            { id: '00', name: 'កែវ វីនសុឧត្តតារា', sex: 'F' }, { id: '00', name: 'ឈុនតា រតនៈខុនដូ', sex: 'F' },
            { id: '64', name: 'លាង វឌ្ឃនធនុ', sex: 'M' }, { id: '00', name: 'យ៉ា ពេជ្រម៉ូនីកា', sex: 'F' },
            { id: '00', name: 'លីម ពុទ្ធិរាជ', sex: 'M' }, { id: '00', name: 'ឡ ស៊ីវហ៊ួយ', sex: 'F' },
            { id: '00', name: 'ឡាយ មុនិចិន្ដា', sex: 'F' }, { id: '00', name: 'អោក និសិ្សត', sex: 'M' },
            { id: '00', name: 'ចន្ទ សុផាយ៉ាមេឃ', sex: 'M' }, { id: '00', name: 'ស៊នវីរៈ បញ្ញាទេពី', sex: 'F' }
        ],
        'Level2': [
            { id: '48', name: 'សុភក្ដិ ទិត្រដាណា', sex: 'F' }, { id: '63', name: 'នឿន វឌ្ឍនះ', sex: 'M' },
            { id: '49', name: 'សុភក្ដិ រតន', sex: 'M' }, { id: '61', name: 'ផល​ សុវណ្ណ', sex: 'M' },
            { id: '53', name: 'ហុង សិទ្ធិណាល់', sex: 'M' }, { id: '55', name: 'ធេង ជូលីញ', sex: 'F' },
            { id: '1', name: 'ឡាយ ភារ៉ាដាវីឌ', sex: 'M' }, { id: '4', name: 'ឡ សុវណ្ណហាន់ណា', sex: 'F' }
        ],
        'មត្ដេយ្យកម្រិតទាប': [
            { id: '147', name: 'សុភក្រ វីរបុត្រ', sex: 'M' }, { id: '166', name: 'លីណា រ័ត្នហុងស័ក្កិអធិភូ', sex: 'M' },
            { id: '160', name: 'ថូ សិទ្ធីយូណា', sex: 'F' }, { id: '175', name: 'ហេង ជ័រម៉ីង', sex: 'F' },
            { id: '000', name: 'វ៉េត នីរីតា', sex: 'F' }
        ] };
    const sel = document.getElementById('classSelect');
    Object.keys(studentDB).forEach(c => sel.add(new Option(c, c)));

    function loadStudents() {
        const tbody = document.getElementById('inputBody'); tbody.innerHTML = '';
        (studentDB[sel.value] || []).forEach((s, i) => {
            tbody.innerHTML += `<tr class="row" data-id="${s.id}" data-name="${s.name}" data-sex="${s.sex}">
                <td align="center">${s.id}</td><td>${s.name}</td><td align="center">${s.sex}</td>
                <td><input type="number" class="s" value="0" style="width:50px"></td><td><input type="number" class="s" value="0" style="width:50px"></td>
                <td><input type="number" class="s" value="0" style="width:50px"></td><td><input type="number" class="s" value="0" style="width:50px"></td>
                <td><input type="file" onchange="previewImg(event, ${i})"><input type="hidden" id="img${i}"></td>
            </tr>`;
        });
    }

    function previewImg(e, i) {
        const reader = new FileReader();
        reader.onload = (f) => document.getElementById('img'+i).value = f.target.result;
        reader.readAsDataURL(e.target.files[0]);
    }

    function render(type) {
        if(!sel.value) return alert("រើសថ្នាក់សិន!");
        let data = [];
        document.querySelectorAll('.row').forEach((r, i) => {
            const scores = Array.from(r.querySelectorAll('.s')).map(input => parseFloat(input.value) || 0);
            const total = scores.reduce((a, b) => a + b, 0);
            data.push({ id: r.dataset.id, name: r.dataset.name, sex: r.dataset.sex, total: total, avg: total/4, img: document.getElementById('img'+i).value });
        });
        data.sort((a, b) => b.avg - a.avg);

        const month = document.getElementById('monthInput').value;
        const year = document.getElementById('yearInput').value;
        const today = `ភ្នំពេញ, ថ្ងៃទី ${new Date().getDate()} ខែ ${month} ឆ្នាំ ២០២៦`;

        let content = `
            <div class="header-section">
                <div class="school-info">មន្ទីរអប់រំ យុវជន និងកីឡារាជធានីភ្នំពេញ<br>សាលាអន្ដរជាតិម៉ាយឃីដ<br>Mikids International school</div>
                <div class="nation-info">ព្រះរាជាណាចក្រកម្ពុជា<br>ជាតិ សាសនា ព្រះមហាក្សត្រ<br>-------</div>
            </div>`;

        if(type === 'REPORT') {
            let rows = data.map((s, i) => `<tr><td>${i+1}</td><td>${s.id}</td><td align="left">${s.name}</td><td>${s.sex}</td><td>${s.total.toFixed(2)}</td><td>${s.avg.toFixed(2)}</td><td>${i+1}</td></tr>`).join('');
            content += `
                <div style="text-align:center; margin-top:20px;"><h2 style="font-family:'Moul'; color:var(--blue);">បញ្ជីចំណាត់ថ្នាក់លទ្ធផលការសិក្សា</h2><p>ថ្នាក់៖ ${sel.value} | ខែ៖ ${month} | ឆ្នាំ៖ ${year}</p></div>
                <table class="report-table"><thead><tr><th>ល.រ</th><th>អត្តលេខ</th><th>គោត្តនាម-នាម</th><th>ភេទ</th><th>សរុប</th><th>មធ្យម</th><th>ចំណាត់ថ្នាក់</th></tr></thead><tbody>${rows}</tbody></table>`;
        } else {
            const getCard = (s, i) => `<div class="student-card"><div class="rank-number">${i+1}</div><div class="photo-frame"><img src="${s.img || 'https://via.placeholder.com/120x150'}"></div><div class="name-label">${s.name}</div></div>`;
            content = `<div class="honor-frame">${content}
                <div style="text-align:center;"><h1 style="font-family:'Moul'; color:var(--red); font-size:32pt; margin:10px 0;">តារាងកិត្តិយស</h1><p style="font-size:14pt;">ប្រចាំខែ ${month} ឆ្នាំសិក្សា ${year}</p></div>
                <div class="star-container">
                    <div class="student-row">${getCard(data[0], 0)}</div>
                    <div class="student-row">${getCard(data[1], 1)}${getCard(data[2], 2)}</div>
                    <div class="student-row">${getCard(data[3], 3)}${getCard(data[4], 4)}</div>
                </div></div>`;
        }

        content += `<div class="signature-section"><div class="signature-box">បានឃើញ និងឯកភាព<br>នាយកសាលលា</div><div class="signature-box" style="font-family:'Battambang'; font-weight:normal;">${today}<br><b style="font-family:'Moul'">គ្រូប្រចាំថ្នាក់</b></div></div>`;
        
        document.getElementById('main-wrap').innerHTML = content;
        document.getElementById('pdf-content').style.display = 'flex';
        document.getElementById('downloadBtn').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    function downloadPDF() {
        const el = document.getElementById('pdf-content');
        html2pdf().from(el).set({ margin: 0, filename: 'MyKids_Result.pdf', image: { type: 'jpeg', quality: 1 }, html2canvas: { scale: 3 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).save();
    }
</script>
</body>
</html>
